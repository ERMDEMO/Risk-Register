<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Emerging Risk Register</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: control-room register. Header and KPI strip, tabbed workspace, right-hand drawer for every edit. */
:root {
  --bg: #f1f4f7; --panel: #ffffff; --panel2: #e8edf2; --line: #d2dae2; --ink: #131f2a; --muted: #55677a;
  --accent: #1a5ccf; --accent-ink: #ffffff; --tint: rgba(26, 92, 207, .09);
  --high: #b92521; --med: #8f5a00; --low: #146d47; --high-bg: #fbe2e0; --med-bg: #fbedcf; --low-bg: #dcf2e6;
  --dot-high: #d9453f; --dot-med: #eea21a; --dot-low: #2eae78; --dot-none: #8a99a8;
  --cell-a: #f6f8fa; --cell-b: #ffffff; --shadow: 0 10px 40px rgba(10, 20, 30, .22);
  --f-display: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141b; --panel: #151f29; --panel2: #1d2a36; --line: #2a3b4b; --ink: #e6edf4; --muted: #92a4b6;
    --accent: #5ea4ff; --accent-ink: #06192f; --tint: rgba(94, 164, 255, .13);
    --high: #ff8a82; --med: #f3bb5c; --low: #55d6a0; --high-bg: #3a1c1d; --med-bg: #3a2c12; --low-bg: #123626;
    --dot-high: #ef5a53; --dot-med: #f2a824; --dot-low: #34c386; --dot-none: #6f8194;
    --cell-a: #121b24; --cell-b: #151f29; --shadow: 0 10px 40px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141b; --panel: #151f29; --panel2: #1d2a36; --line: #2a3b4b; --ink: #e6edf4; --muted: #92a4b6;
  --accent: #5ea4ff; --accent-ink: #06192f; --tint: rgba(94, 164, 255, .13);
  --high: #ff8a82; --med: #f3bb5c; --low: #55d6a0; --high-bg: #3a1c1d; --med-bg: #3a2c12; --low-bg: #123626;
  --dot-high: #ef5a53; --dot-med: #f2a824; --dot-low: #34c386; --dot-none: #6f8194;
  --cell-a: #121b24; --cell-b: #151f29; --shadow: 0 10px 40px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
}
.wrap { max-width: 1320px; margin: 0 auto; }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: .92em; }
.muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.brand { min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: .01em; text-transform: uppercase; }
.brand p { color: var(--muted); margin-top: 3px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.me { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.me img { width: 24px; height: 24px; border-radius: 50%; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; line-height: 1.2; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--high); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.menu { position: relative; }
.menu summary { list-style: none; }
.menu summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; min-width: 15rem; }
.menu .pop button { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu .pop button:hover { background: var(--tint); }
.banner { margin-bottom: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); }
.banner.warn { border-color: var(--med); }
.banner b { color: var(--ink); }

/* tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 14px; cursor: pointer; color: var(--muted); white-space: nowrap; font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }
.tabs .n { font-family: var(--f-body); font-size: 12px; font-weight: 600; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--panel2); color: var(--ink); letter-spacing: 0; }
.tabs .n.hot { background: var(--accent); color: var(--accent-ink); }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 9px; }
.kpi .kl { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.kpi .kv { display: block; font-family: var(--f-display); font-weight: 600; font-size: 36px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi.hi .kv { color: var(--high); } .kpi.md .kv { color: var(--med); } .kpi.ac .kv { color: var(--accent); }
.scan { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-bottom: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.scan .sd { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--dot-none); }
.scan.fresh .sd { background: var(--dot-low); } .scan.aging .sd { background: var(--dot-med); } .scan.stale .sd { background: var(--dot-high); }
.scan .sl { font-weight: 600; } .scan .sm { color: var(--muted); } .scan .btn { margin-left: auto; }

/* cards and grids */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.card h2 { font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.note { color: var(--muted); font-size: 13px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.col { display: grid; gap: 12px; min-width: 0; }
@media (max-width: 900px) { .grid-main { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 2px 12px; cursor: pointer; font-size: 13px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip .n { opacity: .75; margin-left: 4px; }
.sel, .inp { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 8px; min-width: 0; }
.inp.search { width: min(100%, 18rem); }

/* rating chips */
.rt { display: inline-block; border-radius: 4px; padding: 1px 8px; font-weight: 600; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rt.High { background: var(--high-bg); color: var(--high); } .rt.Medium { background: var(--med-bg); color: var(--med); } .rt.Low { background: var(--low-bg); color: var(--low); }
.rt.None { background: var(--panel2); color: var(--muted); }
.st { display: inline-block; border-radius: 4px; padding: 1px 8px; font-size: 12px; background: var(--panel2); color: var(--ink); }
.st.done { background: var(--low-bg); color: var(--low); } .st.wait { background: var(--med-bg); color: var(--med); }
.st.prop { background: var(--tint); color: var(--accent); } .st.bad { background: var(--high-bg); color: var(--high); }
.st.closed { background: var(--panel2); color: var(--muted); }

/* radar */
.radar-box { width: 100%; max-width: 760px; margin: 0 auto; }
.radar-box svg { display: block; width: 100%; height: auto; }
.cellp { stroke: var(--line); stroke-width: 1; }
.hub { fill: var(--bg); stroke: var(--line); }
.ringlbl { fill: var(--muted); font-size: 11px; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; letter-spacing: .04em; }
.wlbl { fill: var(--ink); font-size: 13px; font-weight: 600; }
.dot { cursor: pointer; outline: none; }
.dotc { stroke: var(--panel); stroke-width: 2; }
.dot:hover .dotc, .dot:focus-visible .dotc { stroke: var(--ink); }
.dot.off { opacity: .15; pointer-events: none; }
.d-High { fill: var(--dot-high); } .d-Medium { fill: var(--dot-med); } .d-Low { fill: var(--dot-low); } .d-None { fill: var(--dot-none); }
.dotn { fill: #fff; font-weight: 700; font-size: 11px; pointer-events: none; font-family: var(--f-body); }
.dot.rt-Medium .dotn { fill: #2a1b00; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.areakey { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; justify-content: center; margin-top: 4px; }


/* movement */
.mv-sum { margin-bottom: 12px; display: grid; gap: 6px; }
.mv-head { font-size: 16px; line-height: 1.5; }
.kpi.lo .kv { color: var(--low); }
.heat-box { width: 100%; max-width: 640px; margin: 0 auto; }
.heat-box svg { display: block; width: 100%; height: auto; }
.hm-cell { stroke: var(--panel); stroke-width: 2; }
.hm-high { fill: var(--high-bg); } .hm-med { fill: var(--med-bg); } .hm-low { fill: var(--low-bg); }
.hm-sc { fill: var(--muted); font-size: 10px; }
.hm-ax { fill: var(--muted); font-size: 12px; }
.hm-title { fill: var(--ink); font-size: 12px; font-weight: 600; letter-spacing: .06em; }
.mv-arrow { stroke-width: 2.5; fill: none; }
.mv-arrow.mv-up { stroke: var(--high); } .mv-arrow.mv-down { stroke: var(--low); }
.mv-head-up { fill: var(--high); } .mv-head-down { fill: var(--low); }
.mv-ghost circle { fill: var(--panel); fill-opacity: .7; stroke-width: 2; stroke-dasharray: 3 3; }
.mv-ghost.mv-up circle { stroke: var(--high); } .mv-ghost.mv-down circle { stroke: var(--low); }
.mv-ghost text { fill: var(--muted); font-size: 10px; font-weight: 700; font-family: var(--f-body); }
.mv-newring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.sw-ghost { background: transparent; border: 2px dashed var(--muted); box-sizing: border-box; }
.sw-up { background: var(--high); border-radius: 2px; height: 3px; width: 16px; }
.sw-down { background: var(--low); border-radius: 2px; height: 3px; width: 16px; }
.sw-new { background: transparent; border: 2.5px solid var(--accent); box-sizing: border-box; }
.mvlist { list-style: none; padding: 0; display: grid; gap: 2px; }
.mvrow { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px; border-radius: 6px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.mvrow:hover { background: var(--tint); }
.mvrow .tt { min-width: 0; overflow-wrap: anywhere; }
.mvrow .ts { color: var(--muted); font-size: 12px; }
.mvright { display: grid; gap: 4px; justify-items: end; }
.why { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.why span { font-size: 12px; border-radius: 4px; padding: 1px 7px; background: var(--panel2); color: var(--ink); }
.why .w-up { background: var(--high-bg); color: var(--high); } .why .w-new { background: var(--tint); color: var(--accent); }
.why .w-pr { background: var(--med-bg); color: var(--med); } .why .w-down { background: var(--low-bg); color: var(--low); }
.trend { font-size: 12px; font-weight: 700; white-space: nowrap; }
.trend.up { color: var(--high); } .trend.down { color: var(--low); } .trend.flat { color: var(--muted); font-weight: 500; } .trend.new { color: var(--accent); }
.wk { display: inline-flex; gap: 3px; vertical-align: middle; }
.wk i { width: 13px; height: 13px; border-radius: 3px; background: var(--panel2); display: inline-block; }
.wk i.w1, .wk i.w2, .wk i.w3 { background: var(--accent); }
.wk i.w1 { opacity: .35; } .wk i.w2 { opacity: .65; }
.only-narrow { display: none; }
.ent { display: grid; gap: 10px; }
.ent-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 14px 28px; align-items: start; }
@media (max-width: 760px) { .ent-grid { grid-template-columns: 1fr; } }
.ent-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ent-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ent-num { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 6px 0 10px; }
.ent-v { font-family: var(--f-mono); font-weight: 500; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.ent-High { color: var(--high); } .ent-Medium { color: var(--med); } .ent-Low { color: var(--low); }
.ent-of { color: var(--muted); font-size: 15px; }
.ent-gauge { position: relative; display: flex; gap: 3px; height: 10px; }
.ent-gauge i { display: block; height: 100%; border-radius: 5px; }
.ent-gauge .z-low { width: 32%; background: var(--dot-low); } .ent-gauge .z-med { width: 28%; background: var(--dot-med); } .ent-gauge .z-high { width: 40%; background: var(--dot-high); }
.ent-gauge b { position: absolute; top: -11px; margin-left: -6px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--ink); }
.ent-ticks { position: relative; height: 16px; margin-top: 4px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.ent-ticks span { position: absolute; transform: translateX(-50%); } .ent-ticks span:first-child { transform: none; } .ent-ticks span:last-child { transform: translateX(-100%); }
.ent-right { display: grid; gap: 6px; }
.ent-dim { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.ent-dim b { font-family: var(--f-mono); font-weight: 500; }
.ent-dim.zero { color: var(--muted); }
.ent-c-High { color: var(--high); } .ent-c-Medium { color: var(--med); } .ent-c-Low { color: var(--low); } .ent-c-none { color: var(--muted); }
.ent-flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.ent-flags span { font-size: 12px; border-radius: 999px; padding: 3px 10px; border: 1px solid var(--line); background: var(--panel2); }
.ent-flags .f-hi { background: var(--high-bg); color: var(--high); border-color: transparent; } .ent-flags .f-md { background: var(--med-bg); color: var(--med); border-color: transparent; }
.ent-what { border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; }
.ent-what::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: middle; }
@media (max-width: 760px) { .only-narrow { display: block; max-width: 11rem; } .wk { gap: 2px; } .wk i { width: 9px; height: 9px; border-radius: 2px; } }

/* lists */
.toplist { list-style: none; padding: 0; display: grid; gap: 2px; }
.toprow { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.toprow:hover { background: var(--tint); }
.toprow .tt { min-width: 0; overflow-wrap: anywhere; }
.toprow .ts { color: var(--muted); font-size: 12px; }
.fbars { display: grid; gap: 7px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) 6.5rem 1.6rem; gap: 8px; align-items: center; font-size: 13px; }
.frow.zero { color: var(--muted); }
.bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--panel2); }
.bar i { display: block; height: 100%; }
.attn { display: grid; gap: 6px; }
.attn button { display: flex; justify-content: space-between; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 10px; cursor: pointer; text-align: left; }
.attn button:hover { border-color: var(--accent); }
.attn b { font-family: var(--f-display); font-size: 20px; font-weight: 600; }

/* tables */
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); position: sticky; top: 0; }
.tbl th.sortable { cursor: pointer; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover { background: var(--tint); }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl td.sum { min-width: 16rem; max-width: 34rem; }
.tbl td.mono { white-space: nowrap; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--ink); font-family: var(--f-display); font-size: 20px; text-transform: uppercase; margin-bottom: 4px; }
.bar-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
@media (max-width: 760px) { .hm { display: none; } .brand h1 { font-size: 24px; } }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 20, .5); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 41; display: flex; flex-direction: column; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slidein .16s ease-out; } @keyframes slidein { from { transform: translateX(24px); } } }
.dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.dh .eyebrow { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.dh h2 { font-family: var(--f-display); font-size: 22px; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
.x { border: 0; background: none; font-size: 26px; line-height: 1; cursor: pointer; padding: 0 6px; color: var(--muted); }
.dbody { padding: 14px 16px; overflow-y: auto; flex: 1; display: grid; gap: 14px; align-content: start; }
.dfoot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.dfoot .err { color: var(--high); flex-basis: 100%; }
.sect { display: grid; gap: 8px; }
.sect > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.step { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.step h3 { font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink); }
.step h3 span { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 12px; margin-right: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 10px; }
.fld { display: grid; gap: 3px; min-width: 0; }
.fld > span { font-size: 12px; color: var(--muted); }
.fld input, .fld select, .fld textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
.fld textarea { min-height: 4.2rem; resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button:disabled { opacity: .5; cursor: not-allowed; }
.kv2 { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; }
.kv2 dt { color: var(--muted); } .kv2 dd { overflow-wrap: anywhere; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
.box.prop { border-color: var(--accent); background: var(--tint); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.linkrow { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.scoreprev { font-family: var(--f-display); font-size: 22px; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.guide { display: grid; gap: 14px; max-width: 70ch; }
.guide ol { padding-left: 20px; display: grid; gap: 6px; }
.skeleton { color: var(--muted); padding: 30px 0; text-align: center; }

ports.", "proposed": true, "published": "2026-11-04", "risk_id": "", "source": "Bloomberg (via republishing sites)", "summary": "Bloomberg (4 Nov): Brent January settled 8.7% lower at $94.62, the lowest since 31 Aug, after trading as low as $93.22; WTI December fell 8.3% to $88.12. Drivers cited: the US midterm results, seen by investors as a faster route to ending the war, and Trump telling the FT he had no immediate plans to ramp up fighting. JPMorgan estimated a 1.4 million b/d oil surplus in October.", "touches": "Unsure", "url": "https://www.rigzone.com/news/wire/oil_plunges_as_election_shifts_iran_outlook-04-nov-2026-185012-article/", "id": "SQ-0058"}, "SQ-0059": {"area": "Operations", "at": "2026-11-05T04:38:23.000Z", "by": "claude", "captured": "2026-11-05", "check": "Watch for official US, UAE or NCEMA/ADCMC statements; confirm emergency and continuity plans for loss of generation, gas or desalination supply are current if major combat resumes.", "checked": "Unsure", "conf": "Medium", "decided_by": "claude", "decided_on": "2026-11-05", "decision": "Watch", "func": "Network operations and control", "horizon": "Short", "level": "Regional", "notes": "Proposed by the system, to confirm. Opened the Gulf News live blog (newest entry 07:21, 5 Nov) and Al Jazeera (4 Nov, Anadolu and Reuters, https://www.aljazeera.com/news/2026/11/4/iran-says-us-reply-to-hormuz-plan-unconvincing-trump-confirms-strikes): Trump confirmed a 'minor' US strike on an Iranian anti-aircraft facility early 3 Nov; Iran's Rezaei called the US reply 'not convincing'; Iranian officials suggested Gulf undersea cables could be targeted. Gulf News 4 Nov brief and a Newsmax report on Yahoo (2 Nov) cite WSJ that some Arab states warned Iran they could retaliate if their infrastructure is hit, and that the UAE and Qatar held security drills. Oilprice.com quotes Trump telling the FT there are no immediate plans to strike. Mixed signals; Axios claim not opened directly. No attack on a UAE site reported. ", "feed": "Web", "freq": "As issued", "grade": "C", "level": "Global", "name": "Smart Water Magazine", "owner": "", "terms": "Not yet", "url": "https://smartwatermagazine.com", "why": "Trade news on water-utility technology and desalination suppliers. Lead only: confirm with another source. Page not opened; confirm before relying on it.", "id": "s075"}, "s076": {"area": "Operations", "feed": "Web", "freq": "As issued", "grade": "B", "level": "Global", "name": "IDRA: International Desalination and Reuse Association", "owner": "", "terms": "Not yet", "url": "https://idrawater.org/", "why": "Industry body that held its 2024 World Congress in Abu Dhabi with the Department of Energy as a partner (per its releases). idadesal.org redirects here. Page not opened; confirm before relying on it.", "id": "s076"}, "s077": {"area": "Cyber", "feed": "Email or web alerts", "freq": "As updated", "grade": "A", "level": "Global", "name": "CISA: Known Exploited Vulnerabilities catalog", "owner": "", "terms": "Not yet", "url": "https://www.cisa.gov/known-exploited-vulnerabilities-catalog", "why": "Vulnerabilities confirmed as exploited, with CSV and JSON downloads and email alerts. Match against your meter, SCADA, network and VPN equipment lists. Page checked 22 Oct 2026.", "id": "s077"}, "s078": {"area": "Cyber", "feed": "Web", "freq": "Annual / as issued", "grade": "B", "level": "Global", "name": "Claroty Team82: OT exposure research", "owner": "", "terms": "Not yet", "url": "https://claroty.com/resources/reports/state-of-cps-security-ot-exposures-2025", "why": "State of CPS Security: OT Exposures 2025 covers 940,000+ devices in 270 organisations; 12% had known exploited vulnerabilities. Energy and utilities are not broken out on the page. Page checked 22 Oct 2026.", "id": "s078"}, "s079": {"area": "Cyber", "feed": "Web", "freq": "As issued", "grade": "B", "level": "Global", "name": "Nozomi Networks Labs: OT/IoT threat reports", "owner": "", "terms": "Not yet", "url": "https://www.nozominetworks.com/blog/ot-iot-fields-hot-summer-cyber-trends-of-2026", "why": "Periodic OT/IoT threat reports built on public incidents plus Nozomi telemetry (August 2023 edition opened); this 2026 blog post was linked from it. Vendor research, so cross-check. The 2026 post itself was not opened.", "id": "s079"}, "s080": {"area": "Cyber", "feed": "Web", "freq": "Annual", "grade": "A", "level": "Global", "name": "ENISA Threat Landscape", "owner": "", "terms": "Not yet", "url": "https://www.enisa.europa.eu/topics/cyber-threats/threats-and-trends", "why": "EU agency's annual threat landscape. The page I opened still described the 2022 edition, so look for the current one. It did not mention an energy-specific report.", "id": "s080"}, "s081": {"area": "Operations", "feed": "Web", "freq": "Annual / as issued", "grade": "A", "level": "Global", "name": "NERC: reliability assessments", "owner": "", "terms": "Not yet", "url": "https://www.nerc.com/pa/RAPA/ra/Pages/default.aspx", "why": "Assessments page of the North American reliability body. Press (Power Engineering, POWER) reports its Long-Term Reliability Assessment warns load growth, including AI data centres, is outpacing infrastructure. The list of assessments did not load in my read.", "id": "s081"}, "s082": {"area": "Operations", "feed": "Web", "freq": "As issued", "grade": "A", "level": "Global", "name": "ENTSO-E: final report on the Iberian blackout", "owner": "", "terms": "Not yet", "url": "https://www.entsoe.eu/publications/blackout/28-april-2025-iberian-blackout/", "why": "Final report on the 28 April 2025 Spain and Portugal grid incident, published 20 March 2026. Press coverage says multiple factors contributed. Use for lessons on voltage control, protection and restoration. Page checked 22 Oct 2026.", "id": "s082"}, "s083": {"area": "Strategy and projects", "feed": "Web", "freq": "As issued", "grade": "B", "level": "Global", "name": "Eurelectric", "owner": "", "terms": "Not yet", "url": "https://www.eurelectric.org", "why": "European electricity-industry association with a Power Distribution policy area. Useful for distribution-level regulation and grid-investment themes. Page checked 22 Oct 2026.", "id": "s083"}, "s084": {"area": "Strategy and projects", "feed": "Web", "freq": "Annual / as issued", "grade": "B", "level": "Global", "name": "Ember: electricity data and insights", "owner": "", "terms": "Not yet", "url": "https://ember-energy.org", "why": "Free electricity datasets and analysis; the home page lists the Global Electricity Review 2026. Tracks demand growth, solar and system change. Page checked 22 Oct 2026.", "id": "s084"}, "s085": {"area": "HSE", "feed": "Web", "freq": "As issued", "grade": "A", "level": "Global", "name": "WMO: World Meteorological Organization", "owner": "", "terms": "Not yet", "url": "https://wmo.int", "why": "UN weather and climate agency. Press reports say it found the Arab region warming at about twice the global average. Use for heat load, equipment derating and worker heat stress. The home page did not list regional reports. Page checked 22 Oct 2026.", "id": "s085"}, "s086": {"area": "Operations", "feed": "Web", "freq": "Daily", "grade": "A", "level": "Global", "name": "NOAA Space Weather Prediction Center", "owner": "", "terms": "Not yet", "url": "https://www.spaceweather.gov/", "why": "Alerts, watches, warnings and a 3-day forecast. Geomagnetic storms matter most at high latitudes; for the UAE use it for GNSS timing and radio disturbance awareness. Page checked 22 Oct 2026.", "id": "s086"}, "s087": {"area": "Strategy and projects", "feed": "Web", "freq": "Annual", "grade": "B", "level": "Global", "name": "Allianz Risk Barometer 2026", "owner": "", "terms": "Not yet", "url": "https://allianz.com/en/mediacenter/news/articles/260203-allianz-risk-barometer-2026-cyber-and-ai-as-major-business-risks.html", "why": "Survey of 3,338 risk professionals in nearly 100 countries: cyber 42%, AI 32%, business interruption 29%, regulatory change fourth. Good benchmark for the register. Page checked 22 Oct 2026.", "id": "s087"}, "s088": {"area": "Strategy and projects", "feed": "Web", "freq": "Annual", "grade": "B", "level": "Global", "name": "Swiss Re Institute: SONAR emerging risk insights", "owner": "", "terms": "Not yet", "url": "https://www.swissre.com/institute/research/sonar/sonar2025.html", "why": "SONAR 2025 headline items: extreme heat, spreading fungal disease, harm from plastics and ultra-processed food claims. Only the heat item is directly relevant. Check for a 2026 edition. Page checked 22 Oct 2026.", "id": "s088"}, "s089": {"area": "Workforce", "feed": "Web", "freq": "As issued", "grade": "B", "level": "Global", "name": "WEF Future of Jobs Report 2025", "owner": "", "terms": "Not yet", "url": "https://www.weforum.org/publications/the-future-of-jobs-report-2025/digest/", "why": "63% of employers call skill gaps the biggest barrier to transformation; 41% expect energy generation, storage and distribution to be transformative; renewable energy engineers are among the fastest-growing roles. No utilities-specific findings. Page checked 22 Oct 2026.", "id": "s089"}, "s090": {"area": "Operations", "feed": "Web", "freq": "Monthly", "grade": "B", "level": "Global", "name": "International Crisis Group: CrisisWatch", "owner": "", "terms": "Not yet", "url": "https://www.crisisgroup.org/crisiswatch", "why": "Monthly conflict tracker. The text I read had no section clearly labelled Gulf (it was truncated), so scan its Middle East entries for regional escalation. Page checked 22 Oct 2026.", "id": "s090"}, "s091": {"area": "Supply chain", "feed": "Web", "freq": "As issued", "grade": "A", "level": "Global", "name": "EU F-gas regulation (SF6 in electrical equipment)", "owner": "", "terms": "Not yet", "url": "https://climate.ec.europa.eu/eu-action/fluorinated-greenhouse-gases/f-gas-legislation_en", "why": "Regulation (EU) 2024/573, applying since 11 March 2024. The page gives no SF6 switchgear dates, so read the regulation text on EUR-Lex. Affects switchgear specifications and supplier product ranges. Page checked 22 Oct 2026.", "id": "s091"}, "s092": {"area": "Supply chain", "feed": "Web", "freq": "Quarterly", "grade": "A", "level": "Global", "name": "ICC IMB: piracy and armed robbery reports", "owner": "", "terms": "Not yet", "url": "https://www.icc-ccs.org/wp-content/uploads/2026/04/2026-Jan-Mar-IMB-Piracy-and-Armed-Robbery-Report.pdf", "why": "Jan-Mar 2026 report notes projectile hits on merchant ships in the Persian Gulf, Strait of Hormuz and Gulf of Oman during the US/Israel-Iran conflict (not piracy), Houthi attacks near Yemen, and GNSS/GPS/AIS interference. Page checked 22 Oct 2026.", "id": "s092"}, "s093": {"added": "2026-10-27", "area": "Legal and regulatory", "at": "2026-10-27T13:30:00.000Z", "by": "claude", "feed": "Web", "freq": "As issued", "grade": "A", "level": "Local", "name": "DoE: laws, regulations and codes library", "owner": "", "terms": "Not yet", "url": "https://doe.gov.ae/Legislation-and-Compliance/Laws-and-Regulations", "why": "Energy sector regulatory framework for electricity, water and wastewater: laws, regulations, policies and codes. Check for new or amended rules.", "id": "s093"}, "s094": {"added": "2026-10-27", "area": "Finance", "at": "2026-10-27T13:30:00.000Z", "by": "claude", "feed": "Web", "freq": "As issued", "grade": "A", "level": "Local", "name": "DoE: economic regulation (price controls and revenue limits)", "owner": "", "terms": "Not yet", "url": "https://doe.gov.ae/Legislation-and-Compliance", "why": "Price controls and revenue limits for sector operators; changes affect allowed revenue and recovery of network investment.", "id": "s094"}, "s095": {"added": "2026-10-27", "area": "Operations", "at": "2026-10-27T13:30:00.000Z", "by": "claude", "feed": "Web (Abu Dhabi Media Office)", "freq": "As issued", "grade": "A", "level": "Local", "name": "Abu Dhabi Emergencies, Crises and Disasters Management Centre (ADCMC)", "owner": "", "terms": function shortTitle(t) {

}
function startSig(id) {

  var rk = s.risk_id && S.risks[s.risk_id];

    type: 'sig', id: id, busy: false, err: '',
    draft: { checked: s.checked || '', decision: s.decision || '', risk_id: s.risk_id || '', notes: s.notes || '' },
    nr: { title: shortTitle(s.summary), level: s.level, horizon: s.horizon, area: s.area, func: s.func, lead_dept: LEAD[s.func] || 'ERM', owner: '', likelihood: '', impact: '' }
  });
}
function saveSig() {
  var s = S.signals[D.id], d = D.draft, n = D.nr;
  if (!d.decision) return fail('Pick a decision first.');
  if ((d.decision === 'New risk' || d.decision === 'Add to existing risk') && d.checked !== 'Yes') return fail('Set Checked to Yes first. A signal that has not been checked cannot join the register.');
  if (d.decision === 'Add to existing risk' && !d.risk_id) return fail('Choose which risk this signal supports.');
  var isNew = d.decision === 'New risk' && !(s.risk_id && S.risks[s.risk_id]);
  if (isNew && !String(n.title).trim()) return fail('Give the new risk a title.');
  D.busy = true; D.err = ''; drawerRender();
  var rid = d.decision === 'Add to existing risk' ? d.risk_id : (d.decision === 'New risk' ? (s.risk_id || '') : '');
  var chain = Promise.resolve();
  if (isNew) {
    rid = nextId('ER', S.risks, 2);
    var rk = { id: rid, title: String(n.title).trim(), detail: s.summary, level: n.level, horizon: n.horizon, area: n.area, lead_dept: n.lead_dept, func: n.func, func2: '', owner: String(n.owner || '').trim(), likelihood: num(n.likelihood), impact: num(n.impact), exposure: '', triggers: '', action: '', action_due: '', next_review: addDays(today(), REVIEW_DAYS), status: 'Assess', evidence: s.url || '', added: today(), reviewed: '', src: s.id };
    Object.assign(rk, stamp());
    chain = setDoc('risks/' + rid, rk);
  }
  chain.then(function () {
    return upd('signals/' + s.id, { checked: d.checked, decision: d.decision, risk_id: rid, notes: d.notes || '', decided_on: today(), decided_by: S.uid || 'analyst', proposed: false });
  }).then(function () {
    var what = isNew ? 'created ' + rid + ' from ' + s.id : d.decision === 'Add to existing risk' ? 'added ' + s.id + ' as evidence for ' + rid : d.decision === 'Watch' ? 'put ' + s.id + ' on watch' : 'rejected ' + s.id;
    logEvent(what.charAt(0).toUpperCase() + what.slice(1) + '.', isNew ? rid : s.id);
    closeDrawer(); toast(isNew ? rid + ' created and linked' : 'Decision saved');
    if (isNew) { S.tab = 'register'; schedule(); }
  }).catch(function (e) { D.busy = false; fail(errText(e)); });
}
function fail(msg) { if (D) { D.busy = false; D.err = msg; drawerRender(); } return false; }
function errText(e) {
  var c = e && e.code;

  if (c === 'quota_exceeded') return 'The register is full. Delete old entries or ask Claude to clear space.';
  if (c === 'revoked') return 'Your access changed while the page was open. Reload the page.';
  return 'Could not save. Check your connection and try again.';
}

  var names = Object.keys(S.sources).map(function (k) { return S.sources[k].name; }).sort();
  var body = '<div class="sect"><p class="note">Use public information only. Keep confidential company data out of the summary.</p>' +
    fld('Source', '<input id="draft-source" data-g="draft" data-f="source" list="src-list" value="' + esc(d.source) + '"><datalist id="src-list">' + names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>') +
    inpF('draft', 'url', 'Link to the item', d.url, 'url', 'placeholder="https://"') +
    areaF('draft', 'summary', 'One-line summary (public facts only)', d.summary, 3) +
    '<div class="grid2">' + inpF('draft', 'published', 'Published (date or month)', d.published, 'text', 'placeholder="2026-10-12"') + selF('draft', 'level', 'Level', LEVELS, d.level) + selF('draft', 'area', 'Impact area', AREAS, d.area) + selF('draft', 'func', 'Likely function', FUNCS, d.func) + selF('draft', 'horizon', 'Proposed horizon', HORIZONS.map(function (h) { return [h, HZ_LABEL[h]]; }), d.horizon) + selF('draft', 'conf', 'Confidence', ['High', 'Medium', 'Low'], d.conf) + '</div>' +
    areaF('draft', 'check', 'What must be checked before accepting', d.check, 2) + '</div>';
  return { eyebrow: 'New signal', title: 'Add a signal', body: body, foot: footBtns('save-newsig', 'Add signal', '') };
}
function saveNewSig() {
  var d = D.draft;
  if (!d.summary.trim()) return fail('Write a one-line summary.');
  if (!d.source.trim()) return fail('Say where it came from.');
  D.busy = true; D.err = ''; drawerRender();
  var id = nextId('SQ', S.signals, 4);
  var doc = { id: id, captured: today(), published: d.published.trim(), source: d.source.trim(), url: d.url.trim(), summary: d.summary.trim(), level: d.level, area: d.area, func: d.func, horizon: d.horizon, touches: 'Unsure', conf: d.conf, check: d.check.trim(), checked: '', decision: '', risk_id: '', decided_on: '', decided_by: '', proposed: false, notes: '' };
  Object.assign(doc, stamp());
  setDoc('signals/' + id, doc).then(function () { logEvent('Added signal ' + id + '.', id); closeDrawer(); toast(id + ' added'); S.f.sigView = 'await'; S.tab = 'signals'; schedule(); })
    .catch(function (e) { D.busy = false; fail(errText(e)); });
}

/* risk drawer */
function riskDrawer() {
  var d = D.draft, isNew = !D.id, r = S.risks[D.id] || {}, dis = !wr() || D.busy;
  var sc = d.likelihood && d.impact ? d.likelihood * d.impact : null, rt = rating(sc);
  var ls = linked(D.id || '').sort(byId);
  var linkH = ls.length ? ls.map(function (s) { return '<button type="button" class="linkrow" data-act="open-sig" data-id="' + esc(s.id) + '"><span><span class="mono">' + esc(s.id) + '</span> ' + esc(s.source) + (s.proposed ? ' <span class="st prop">proposed</span>' : '') + '</span><span class="note">' + esc(fmt(s.published || s.captured)) + '</span></button>'; }).join('') : '<p class="note">No signals linked yet.</p>';
  var ro = dis ? ' disabled' : '';
  var body = (isNew ? '' : '<div class="pills">' + ratingChip(Object.assign({}, r, d, { likelihood: d.likelihood, impact: d.impact })) + '<span class="st">' + esc(d.status) + '</span>' + missing(d).map(function (m) { return '<span class="st wait">needs ' + esc(m) + '</span>'; }).join('') + '</div>') +
    '<div class="sect">' + areaF('draft', 'title', 'Risk title', d.title, 2) + areaF('draft', 'detail', 'What could happen', d.detail, 3) + '</div>' +
    '<div class="grid2">' + selF('draft', 'level', 'Level', LEVELS, d.level) + selF('draft', 'horizon', 'Horizon', HORIZONS.map(function (h) { return [h, HZ_LABEL[h]]; }), d.horizon) + selF('draft', 'area', 'Impact area', AREAS, d.area) + selF('draft', 'status', 'Status', STATUSES, d.status) + selF('draft', 'func', 'Primary function', FUNCS, d.func) + selF('draft', 'func2', 'Secondary function', FUNCS, d.func2, 'None') + selF('draft', 'lead_dept', 'Lead department', DEPTS, d.lead_dept) + inpF('draft', 'owner', 'Named owner', d.owner) + '</div>' +
    '<div class="step"><h3>Score</h3><div class="grid2">' + selF('draft', 'likelihood', 'Likelihood', [1, 2, 3, 4, 5].map(function (i) { return [i, i + ' ' + LIKE[i]]; }), d.likelihood, 'Not set') + selF('draft', 'impact', 'Impact on the organisation', [1, 2, 3, 4, 5].map(function (i) { return [i, i + ' ' + IMPACT[i]]; }), d.impact, 'Not set') + '</div><div id="score-prev" class="scoreprev">' + scoreText(sc) + '</div></div>' +
    '<div class="sect">' + areaF('draft', 'exposure', 'Exposure statement', d.exposure, 3) + areaF('draft', 'triggers', 'Trigger indicators to watch', d.triggers, 3) + areaF('draft', 'action', 'Planned action', d.action, 3) + '</div>' +
    '<div class="grid2">' + inpF('draft', 'action_due', 'Action due', d.action_due, 'date') + inpF('draft', 'next_review', 'Next review', d.next_review, 'date') + '</div>' +
    '<div class="sect">' + inpF('draft', 'evidence', 'Evidence link', d.evidence, 'url') + '</div>' +
    (isNew ? '' : '<div class="sect"><h3>Linked signals (' + ls.length + ')</h3>' + linkH + '</div><p class="note">Added ' + esc(fmt(r.added)) + (r.reviewed ? ' · last reviewed ' + esc(fmt(r.reviewed)) : '') + (r.by ? ' · last changed by ' + who(r.by) + ' on ' + esc(fmtTime(r.at)) : '') + '</p>');
  var extra = isNew || !wr() ? '' : '<button type="button" class="btn sm" data-act="risk-reviewed">Mark reviewed today</button> ' + (r.status === 'Closed' ? '<button type="button" class="btn sm" data-act="risk-reopen">Reopen</button>' : '<button type="button" class="btn sm danger" data-act="risk-close">Close risk</button>');
  return { eyebrow: isNew ? 'New risk' : 'Risk ' + esc(D.id), title: isNew ? 'Add a risk' : esc(r.title || D.id), body: body, foot: footBtns('save-risk', isNew ? 'Add risk' : 'Save changes', extra) };
}
function scoreText(sc) { var rt = rating(sc); return sc ? 'Score ' + sc + ' · ' + rt : 'Set likelihood and impact to score this risk'; }
function riskDraft(r) {
  return { title: r.title || '', detail: r.detail || '', level: r.level || 'Regional', horizon: r.horizon || 'Short', area: r.area || 'Supply chain', status: r.status || 'Assess', func: r.func || FUNCS[0], func2: r.func2 || '', lead_dept: r.lead_dept || 'ERM', owner: r.owner || '', likelihood: r.likelihood || '', impact: r.impact || '', exposure: r.exposure || '', triggers: r.triggers || '', action: r.action || '', action_due: r.action_due || '', next_review: r.next_review || addDays(today(), REVIEW_DAYS), evidence: r.evidence || '' };
}
function startRisk(id) { var r = S.risks[id]; if (!r) return; openDrawer({ type: 'risk', id: id, busy: false, err: '', draft: riskDraft(r) }); }
function riskPayload(d) {
  return { title: d.title.trim(), detail: d.detail.trim(), level: d.level, horizon: d.horizon, area: d.area, status: d.status, func: d.func, func2: d.func2 || '', lead_dept: d.lead_dept, owner: d.owner.trim(), likelihood: num(d.likelihood), impact: num(d.impact), exposure: d.exposure.trim(), triggers: d.triggers.trim(), action: d.action.trim(), action_due: d.action_due || '', next_review: d.next_review || '', evidence: d.evidence.trim() };
}
function saveRisk(extra, msg) {
  var d = D.draft;
  if (!d.title.trim()) return fail('Give the risk a title.');
  D.busy = true; D.err = ''; drawerRender();
  var p;
  if (!D.id) {
    var id = nextId('ER', S.risks, 2), doc = Object.assign({ id: id }, riskPayload(d), { added: today(), reviewed: '', src: '' }, extra || {}); Object.assign(doc, stamp());
    p = setDoc('risks/' + id, doc).then(function () { logEvent('Added risk ' + id + '.', id); return id; });
  } else {
    p = upd('risks/' + D.id, Object.assign(riskPayload(d), extra || {})).then(function () { logEvent((msg || 'Updated') + ' ' + D.id + '.', D.id); return D.id; });
  }
  p.then(function (id) { closeDrawer(); toast(msg ? msg + ' ' + id : id + ' saved'); }).catch(function (e) { D.busy = false; fail(errText(e)); });
}

/* source drawer */
function srcDrawer() {
  var d = D.draft, isNew = !D.id;
  var body = '<div class="sect">' + inpF('draft', 'name', 'Source name', d.name) + inpF('draft', 'url', 'Link', d.url, 'url') + areaF('draft', 'why', 'Why it matters', d.why, 3) + '</div>' +
    '<div class="grid2">' + selF('draft', 'level', 'Level', LEVELS, d.level) + selF('draft', 'area', 'Impact area', AREAS, d.area) + inpF('draft', 'freq', 'Update frequency', d.freq) + inpF('draft', 'feed', 'Feed or alert type', d.feed) + selF('draft', 'grade', 'Grade', [['A', 'A authoritative'], ['B', 'B reputable'], ['C', 'C lead only']], d.grade) + selF('draft', 'terms', 'Terms of use checked?', ['Not yet', 'Yes', 'No'], d.terms) + inpF('draft', 'owner', 'Owner (analyst)', d.owner) + '</div>';
  var del = !isNew && wr() ? (D.confirmDel ? '<button type="button" class="btn sm danger" data-act="src-del-yes">Yes, delete this source</button>' : '<button type="button" class="btn sm danger" data-act="src-del">Delete</button>') : '';
  return { eyebrow: isNew ? 'New source' : 'Source', title: isNew ? 'Add a source' : esc(d.name), body: body, foot: footBtns('save-src', isNew ? 'Add source' : 'Save changes', del) };
}
function srcDraft(s) { return { name: s.name || '', url: s.url || '', why: s.why || '', level: s.level || 'Global', area: s.area || 'Supply chain', freq: s.freq || 'As issued', feed: s.feed || 'Web', grade: s.grade || 'B', terms: s.terms || 'Not yet', owner: s.owner || '' }; }
function saveSrc() {
  var d = D.draft; if (!d.name.trim()) return fail('Give the source a name.');
  D.busy = true; D.err = ''; drawerRender();
  var id = D.id || ('s' + String(Date.now()).slice(-8)), doc = Object.assign({ id: id }, d, { name: d.name.trim(), url: d.url.trim(), why: d.why.trim() }); Object.assign(doc, stamp());
  setDoc('sources/' + id, doc).then(function () { logEvent((D.id ? 'Updated' : 'Added') + ' source: ' + doc.name + '.', ''); closeDrawer(); toast('Source saved'); }).catch(function (e) { D.busy = false; fail(errText(e)); });
}

/* ---------- names ---------- */
function hydrateNames() {
  var nodes = $$('.who[data-uid]'); if (!nodes.length || !S.user) return;
  var ids = {}; nodes.forEach(function (n) { ids[n.getAttribute('data-uid')] = 1; });
  S.user.profiles(Object.keys(ids)).then(function (ps) {
    nodes.forEach(function (n) { var p = ps[n.getAttribute('data-uid')]; if (p) n.textContent = p.isMe ? 'You' : (p.name || 'A team member'); });
  }).catch(function () {});
}

/* ---------- export ---------- */
function exportCsv(kind) {
  if (!S.downloads) return toast('Downloads are not available in this view.');
  var rows, name;
  if (kind === 'risks') {
    rows = [['Risk ID', 'Emerging risk', 'Detail', 'Level', 'Horizon', 'Impact area', 'Lead department', 'Primary function', 'Secondary function', 'Named owner', 'Likelihood', 'Impact', 'Score', 'Rating', 'Exposure statement', 'Trigger indicators', 'Planned action', 'Action due', 'Next review', 'Status', 'Source signal', 'Evidence link', 'Date added', 'Last reviewed', 'Signals linked']];
    riskList().sort(byId).forEach(function (r) { var sc = score(r); rows.push([r.id, r.title, r.detail, r.level, HZ_LABEL[r.horizon] || r.horizon, r.area, r.lead_dept, r.func, r.func2, r.owner, r.likelihood, r.impact, sc, rating(sc), r.exposure, r.triggers, r.action, r.action_due, r.next_review, r.status, r.src, r.evidence, r.added, r.reviewed, linked(r.id).length]); });
    name = 'Emerging_Risk_Register_';
  } else if (kind === 'signals') {
    rows = [['Signal ID', 'Captured', 'Published', 'Source', 'Link', 'Summary', 'Level', 'Impact area', 'Likely function', 'Horizon', 'AI confidence', 'Checked', 'Decision', 'Risk ID', 'Decided on', 'Proposed by the system, unconfirmed', 'Notes']];
    sigList().sort(byId).forEach(function (s) { rows.push([s.id, s.captured, s.published, s.source, s.url, s.summary, s.level, s.area, s.func, HZ_LABEL[s.horizon] || s.horizon, s.conf, s.checked, s.decision, s.risk_id, s.decided_on, s.proposed ? 'Yes' : '', s.notes]); });
    name = 'Signal_Queue_';
  } else {
    rows = [['Source', 'Level', 'Impact area', 'Update frequency', 'Feed', 'Grade', 'Terms checked', 'Owner', 'Link', 'Why it matters']];
    Object.keys(S.sources).map(function (k) { return S.sources[k]; }).sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (s) { rows.push([s.name, s.level, s.area, s.freq, s.feed, s.grade, s.terms, s.owner, s.url, s.why]); });
    name = 'Scanning_Sources_';
  }
  var det = $('#exp-menu'); if (det) det.removeAttribute('open');
  S.downloads.save({ filename: name + today() + '.csv', data: csvText(rows) }).then(function () { toast('Saved'); }).catch(function (e) { if (e && e.code !== 'declined') toast('Could not save the file.'); });
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) { var m = $('#exp-menu'); if (m && m.open && !e.target.closest('#exp-menu')) m.removeAttribute('open'); return; }
  if (e.target.closest('a') && t.tagName === 'TR') return;
  var a = t.getAttribute('data-act'), v = t.getAttribute('data-v'), id = t.getAttribute('data-id');
  switch (a) {
    case 'tab': S.tab = v; S.f.regFilter = S.f.regFilter; render(); break;
    case 'export': exportCsv(v); break;
    case 'rd-rating': S.f.radarRating = v; render(); break;
    case 'mv-base': S.f.mvBase = v; render(); break;
    case 'open-risk': if (D) { D = null; } startRisk(id); break;
    case 'open-sig': if (D) { D = null; } startSig(id); break;
    case 'open-src': startSrc(id); break;
    case 'go-signals': S.tab = 'signals'; S.f.sigView = 'await'; render(); break;
    case 'go-noowner': S.tab = 'register'; S.f.regFilter = 'noowner'; render(); break;
    case 'go-unscored': S.tab = 'register'; S.f.regFilter = 'unscored'; render(); break;
    case 'go-due': S.tab = 'register'; S.f.regFilter = 'due'; render(); break;
    case 'rg-closed': S.f.regClosed = !S.f.regClosed; render(); break;
    case 'rg-clearfilter': S.f.regFilter = ''; render(); break;
    case 'sig-view': S.f.sigView = v; render(); break;
    case 'src-level': S.f.srcLevel = v; render(); break;
    case 'new-sig': openDrawer({ type: 'newsig', busy: false, err: '', draft: { source: '', url: '', summary: '', published: '', level: 'Global', area: 'Supply chain', func: FUNCS[0], horizon: 'Short', conf: 'Medium', check: '' } }); break;
    case 'new-risk': openDrawer({ type: 'risk', id: '', busy: false, err: '', draft: riskDraft({}) }); break;
    case 'new-src': openDrawer({ type: 'src', id: '', busy: false, err: '', draft: srcDraft({}) }); break;
    case 'record-scan': {
      var u = stamp();
      S.db.doc('meta/scan').set({ at: u.at, by: u.by, note: 'Recorded by an analyst after checking the sources' }).then(function () { logEvent('Recorded a source scan.', ''); toast('Scan recorded'); }).catch(function (x) { toast(errText(x)); });
      break;
    }
    case 'close-drawer': closeDrawer(); break;
    case 'seg': if (!D) break; (D[t.getAttribute('data-g')])[t.getAttribute('data-f')] = v; if (D.type === 'sig' && t.getAttribute('data-f') === 'decision' && v === 'New risk') { D.nr.title = D.nr.title; } drawerRender(); break;
    case 'save-sig': saveSig(); break;
    case 'save-newsig': saveNewSig(); break;
    case 'save-risk': saveRisk(); break;
    case 'risk-reviewed': D.draft.next_review = addDays(today(), REVIEW_DAYS); saveRisk({ reviewed: today() }, 'Reviewed'); break;
    case 'risk-close': D.draft.status = 'Closed'; saveRisk({}, 'Closed'); break;
    case 'risk-reopen': D.draft.status = 'Assess'; saveRisk({}, 'Reopened'); break;
    case 'save-src': saveSrc(); break;
    case 'src-del': D.confirmDel = true; drawerRender(); break;
    case 'src-del-yes':
      D.busy = true; drawerRender();
      S.db.doc('sources/' + D.id).delete().then(function () { logEvent('Deleted source ' + D.draft.name + '.', ''); closeDrawer(); toast('Source deleted'); }).catch(function (x) { D.busy = false; fail(errText(x)); });
      break;
  }
});
function startSrc(id) { var s = S.sources[id]; if (!s) return; openDrawer({ type: 'src', id: id, busy: false, err: '', draft: srcDraft(s) }); }
document.addEventListener('input', function (e) {
  var t = e.target, a = t.getAttribute && t.getAttribute('data-act');
  if (a === 'sig-q') { S.f.sigQ = t.value; render(); return; }
  if (a === 'rg-q') { S.f.regQ = t.value; render(); return; }
  if (a === 'src-q') { S.f.srcQ = t.value; render(); return; }
  var g = t.getAttribute && t.getAttribute('data-g'), f = t.getAttribute && t.getAttribute('data-f');
  if (g && f && D && D[g]) {
    D[g][f] = t.value;
    if (D.type === 'risk' && (f === 'likelihood' || f === 'impact')) { var sc = num(D.draft.likelihood) && num(D.draft.impact) ? Number(D.draft.likelihood) * Number(D.draft.impact) : null; var p = $('#score-prev'); if (p) p.textContent = scoreText(sc); }
  }
});
document.addEventListener('change', function (e) {
  var t = e.target, a = t.getAttribute && t.getAttribute('data-act');
  if (a === 'rd-func') { S.f.radarFunc = t.value; render(); }
  else if (a === 'rg-rating') { S.f.regRating = t.value; render(); }
  else if (a === 'rg-hz') { S.f.regHz = t.value; render(); }
  else if (a === 'rg-func') { S.f.regFunc = t.value; render(); }
  else if (a === 'rg-sort') { S.f.regSort = t.value; render(); }
  else if (t.getAttribute && t.getAttribute('data-g') === 'nr' && t.getAttribute('data-f') === 'func' && D) { D.nr.lead_dept = LEAD[t.value] || D.nr.lead_dept; drawerRender(); }
  else if (t.getAttribute && t.getAttribute('data-g') === 'draft' && t.getAttribute('data-f') === 'func' && D && D.type === 'risk' && !D.id) { D.draft.lead_dept = LEAD[t.value] || D.draft.lead_dept; drawerRender(); }
  else if (D && D.type === 'risk' && t.getAttribute && t.getAttribute('data-f') && D.id) { /* edits are held until Save */ }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && D) { closeDrawer(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act], g.dot')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (S.tab === 'radar') drawRadar(); if (S.tab === 'movement') drawHeat(); }, 120); });
function hashTab() { var h = (location.hash || '').replace('#', ''); if (TABS.some(function (t) { return t[0] === h; })) { S.tab = h; render(); } }
window.addEventListener('hashchange', hashTab);

/* ---------- start ---------- */
function start() {
  var c = window.claude;
  hashTab(); renderTabs(); renderNotice();
  if (!c || !c.use) { render(); return; }
  Promise.all([c.use('db'), c.use('user'), c.use('downloads')]).then(function (r) {
    S.db = r[0]; S.user = r[1]; S.downloads = r[2];
    var jobs = [];
    if (S.user) {
      jobs.push(S.user.id().then(function (i) { S.uid = i; }));
      jobs.push(S.user.me().then(function (m) { S.me = m; $('#me').innerHTML = '<img alt="" src="' + esc(m.avatarUrl) + '"><span>' + esc(m.name || 'You') + '</span>'; }));
      jobs.push(S.user.can('data.write').then(function (b) { S.canWrite = b; }));
    }
    return Promise.all(jobs.map(function (p) { return p.catch(function () {}); }));
  }).then(function () {
    if (S.db) subscribe();
    render();
  });
}
start();
})();
</script>
