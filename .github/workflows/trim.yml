name: Trim register to example

on:
  push:
    paths: ["inbox/trim-*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Back up, then trim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scanner/trim.py
      - name: Keep the backup as a workflow artifact (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: register-backup
          path: backup/register-backup.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Save the context file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add inbox/context.json
          git diff --cached --quiet || (git commit -m "Update scan context after trim" && git pull --rebase -q origin main && git push)
